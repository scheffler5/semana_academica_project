# nginx: entrega o site React e repassa /api para o FastAPI (porta 8000, só local)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;         # não revela a versão do nginx
    client_max_body_size 6M;   # fotos de até 5 MB

    server {
        listen 80 default_server;
        server_name _;
        root /opt/estoque/frontend/dist;
        index index.html;

        # Cabeçalhos de segurança
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Nunca servir arquivos ocultos (.env, .git...) por engano
        location ~ /\. { deny all; return 404; }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;   # o agente do Bedrock pode demorar alguns segundos
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
